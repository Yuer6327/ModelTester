name: publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: dsh host compatibility
        run: pnpm compat

      - name: Build
        run: pnpm build

      # 幂等发布：版本已在 npm 上时跳过（不重发、不假红）。
      # 非 release 提交（文档/工具）不被迫 bump 版本；真正的新版本照常自动发布。
      - name: Check version on npm
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm, publish will be skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is new, will publish"
          fi

      # 发布闸门：仓库未配置 NPM_TOKEN secret 时一律跳过发布（npm 发布保持关闭）。
      # 启用方法：在仓库 Settings → Secrets and variables → Actions 添加 NPM_TOKEN。
      - name: Check NPM_TOKEN secret
        id: npm_token
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN secret is not configured on this repo, publish is skipped"
          fi

      - name: Publish to npm
        if: steps.npm_token.outputs.has == 'true' && steps.published.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks
